name: ecommerce-components-dev

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: components
      POSTGRES_PASSWORD: components_dev_password
      POSTGRES_DB: components
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: